name: Companion CI

on:
  push:
    branches: ['**']
    paths: ['companion/**', '.github/workflows/companion-ci.yml']
  pull_request:
    branches: [main]
    paths: ['companion/**', '.github/workflows/companion-ci.yml']

jobs:
  test:
    name: pytest (mavlink_bridge)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v
