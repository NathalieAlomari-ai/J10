[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "j10-shm-protocol"
version = "0.1.0"
description = "J10 shared-memory wire contract: (vx, vy, vz, yaw_rate) handoff between the CV node and the MAVLink bridge. No dependencies beyond the standard library — the point is that both sides can depend on this without depending on each other."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["j10_shm_protocol"]

[tool.pytest.ini_options]
testpaths = ["tests"]
