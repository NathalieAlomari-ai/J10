[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "j10-mavlink-bridge"
version = "0.1.0"
description = "J10 PT1 companion-computer microservice: Serial/UART MAVLink bridge from a shared-memory CV velocity adapter to the CUAV V7 Nano flight controller."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "pymavlink>=2.4.37",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
j10-mavlink-bridge = "mavlink_bridge.__main__:main"

[tool.setuptools]
packages = ["mavlink_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
