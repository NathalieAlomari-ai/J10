# Minimal MAVROS configuration for ArduPilot SITL.
#
# Kept deliberately small. MAVROS ships a full apm_config.yaml with per-plugin tuning; the
# only values Phase 1 actually needs are the link and the target IDs, and a short list
# keeps it obvious what we changed.
#
# The wildcard key applies regardless of the node name mavros_node is launched under.

/**:
  ros__parameters:
    # sim_vehicle.py's MAVProxy forwards to 127.0.0.1:14550 and :14551 by default.
    # run_sitl.sh adds an explicit --out for 14551; MAVROS binds it and learns the remote
    # endpoint from the first packet.
    fcu_url: "udp://:14551@"
    gcs_url: ""

    target_system_id: 1
    target_component_id: 1

    fcu_protocol: "v2.0"

    # ArduPilot streams these at whatever rate the FC is configured for; asking for a rate
    # here keeps /mavros/local_position/* fast enough to feed a 20 Hz VehicleState.
    conn:
      timeout: 10.0
      heartbeat_rate: 1.0

    sys:
      min_voltage: [10.0]
      disable_diag: false

    # Allowlist, not denylist. Several stock plugins on this build independently reuse the
    # relative topic name "~/status" (companion_process_status and esc_status both
    # confirmed crashing mavros_node on startup with a duplicate publisher/subscriber);
    # excluding them by name one crash at a time proved unreliable, and this installed
    # build's plugin id strings have already disagreed with upstream ros2-branch source
    # more than once while chasing that (e.g. "command"/"sys_status" here vs. "cmd"/"sys"
    # in source). This exact list — plugin_denylist: ['*'] with the allowlist below as the
    # only carve-out — was captured empirically: `plugin_denylist: ['*']` with no allowlist
    # blocks every plugin, letting mavros_node print "Plugin <id> ignored" for the complete,
    # authoritative id list for this build with zero crash risk, then the five plugins
    # Phase 1 actually needs were picked out of that captured list and verified against it
    # with Python's fnmatch (same matching mavros_uas.cpp's is_plugin_allowed() uses).
    #
    #   sys_status     -> /mavros/state, /mavros/battery, /mavros/estimator_status
    #   local_position  -> /mavros/local_position/pose, /mavros/local_position/velocity_local
    #   setpoint_raw    -> /mavros/setpoint_raw/local — the bridge's core output
    #   command         -> /mavros/cmd/arming, /mavros/cmd/takeoff, /mavros/set_mode
    #   rangefinder     -> /mavros/rangefinder/rangefinder
    #
    # px4flow is deliberately excluded — not needed until the real MTF-01 flow path is
    # exercised in Phase 6; vehicle_state_node already treats that topic being entirely
    # absent as flow_valid staying false rather than an error.
    plugin_denylist:
      - '*'
    plugin_allowlist:
      - sys_status
      - command
      - local_position
      - setpoint_raw
      - rangefinder
